name: CI

# Build, vet, unit tests, the copy of the control plane's command kinds matching the control-plane commit it names
# (contract/SOURCE, synced by scripts/sync-kinds.sh), and the image, pushed only from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          # github.com/lxc/incus/v7 needs >= 1.25.11.
          go-version: '1.26'

      - name: Kinds copy matches contract/SOURCE
        run: |
          sha=$(cat contract/SOURCE)
          curl -fsSL "https://raw.githubusercontent.com/OpenViCloud/titan-control-plane/$sha/Titan.Domain/Aggregates/ProviderCommand/Enums/ProviderCommandKinds.cs" \
            | diff - contract/ProviderCommandKinds.cs

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

  # Built on every run beside the tests, its layers kept in the Actions cache. Pushed only from main, once the tests
  # passed, by the push job reading those layers back, tagged with the full commit sha. The source label links the
  # package to this repository.
  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=titan-incus-worker
          cache-to: type=gha,mode=max,scope=titan-incus-worker

  push:
    name: Image push
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/openvicloud/titan-incus-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=titan-incus-worker
